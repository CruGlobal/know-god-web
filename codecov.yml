# Coverage is reported for visibility only and never fails a check
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Test setup files and shared mocks are loaded by every spec, so they are not app code
ignore:
  - 'src/test.ts'
  - 'src/polyfills.ts'
  - 'src/app/_tests/**'
